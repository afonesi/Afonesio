plugins {
    id 'fabric-loom' version '0.10-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" } // ModMenu
    maven { url "https://maven.shedaniel.me/" }                // Cloth Config
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Меню настроек мода
    modImplementation "com.terraformersmc:modmenu:2.0.14"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:4.11.26"

    // ВАЖНО: Sodium/Krypton НЕ добавляем как зависимость сборки.
    // Совместимость делаем через "мягкую" (soft) зависимость в fabric.mod.json
    // и через отдельные mixin-конфиги, которые применяются только если
    // соответствующий мод найден в classpath (см. AfonesiBoostCompat).
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
